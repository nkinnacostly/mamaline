name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  service:
    name: Service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: service/package-lock.json
      - run: npm ci
      - run: npm test

  api:
    name: API checks, tests and migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        # Neon runs Postgres 17 by default; test migrations against the same major version.
        image: postgres:17
        env:
          POSTGRES_USER: mamaline
          POSTGRES_PASSWORD: mamaline
          POSTGRES_DB: mamaline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mamaline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://mamaline:mamaline@localhost:5432/mamaline_test
      DIRECT_URL: postgresql://mamaline:mamaline@localhost:5432/mamaline_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      # Fails if schema.prisma changed without a migration: the migrated database must match the schema
      - run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npx prisma db seed
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e

  web:
    name: Website checks and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Generates the route types (LayoutProps and friends) that tsc needs
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
